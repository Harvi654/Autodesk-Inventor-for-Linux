; 3D mouse buttons for Inventor (spacenav/siappdll.c).
;
; The launcher keeps this file on the Linux side; edit it at
; ~/.config/inventor-on-linux/spacemouse.ini. It is read at every button
; press: changes apply at once, no restart.

[settings]
; a press held this long (ms) runs the button's "<n>.long" action
long_ms = 500

[buttons]
; SpaceMouse Wireless / Compact: left, right
0 = menu:views
1 = fit
; SpaceMouse Enterprise (spacenavd 1.4), numbers as the labels say:
;   0-11 keys 1-12 (0 and 1 double as Wireless left/right, see above)
;   12 Menu, 13 Fit, 14 T, 15 R, 16 F, 17 Rotate, 18 Esc, 19 Alt, 20 Shift,
;   21 Ctrl, 22 Lock, 23 Enter, 24 Delete, 25 Tab, 26 Space, 27-29 V1-V3, 30 ISO1
; keys 1-12 are yours: e.g. 2 = cmd:AppUndoCmd (names via the action dumpcmds)
2 = view:iso
3 = view:iso2
12 = menu:views
13 = fit
14 = view:top
14.long = view:bottom
15 = view:right
15.long = view:left
16 = view:front
16.long = view:back
17 = roll:90
17.long = roll:-90
18 = key:esc
19 = hold:alt
20 = hold:shift
21 = hold:ctrl
22 = lockrot
23 = key:enter
24 = key:del
25 = key:tab
26 = key:space
27 = restoreview:1
27.long = saveview:1
28 = restoreview:2
28.long = saveview:2
29 = restoreview:3
29.long = saveview:3
30 = view:iso
30.long = view:iso2

[menu:views]
title = Views
1 = Top | view:top
2 = Iso | view:iso
3 = Right | view:right
4 = Front | view:front
5 = Bottom | view:bottom
6 = Back | view:back
7 = Left | view:left
8 = Home | home
