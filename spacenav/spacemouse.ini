; 3D mouse buttons for Inventor (spacenav/siappdll.c).
;
; The launcher links this file's folder into the prefix, so edit it at
; ~/.config/inventor-on-linux/spacemouse.ini. It is read at every button
; press: changes apply at once, no restart.
;
; [buttons]: button number = action. The numbers are spacenavd's, from 0;
; with SIAPPDLL_LOG set, every press is logged ("button 3 press").
;
; Actions:
;   menu:<name>      radial menu from the [menu:<name>] section
;   view:<name>      front, back, top, bottom, left, right, iso, iso2
;                    (or any ViewOrientationTypeEnum name, kIsoBottomRightViewOrientation, ...)
;   fit              zoom to fit
;   home             home view
;   cmd:<name>       an Inventor command by its internal name, e.g. cmd:AppUndoCmd;
;                    the action "dumpcmds" writes all of them to inventor-commands.txt
;                    next to this file
;   key:<keys>       keys for the active window: key:esc, key:ctrl+z, key:shift+f5
;   none             nothing
;
; [menu:<name>]: up to 8 items "<n> = label | action", item 1 at the top,
; the others clockwise. title = the text in the middle. A menu item can open
; another menu.

[buttons]
0 = menu:views
1 = fit

[menu:views]
title = Views
1 = Top | view:top
2 = Iso | view:iso
3 = Right | view:right
4 = Front | view:front
5 = Bottom | view:bottom
6 = Back | view:back
7 = Left | view:left
8 = Home | home
