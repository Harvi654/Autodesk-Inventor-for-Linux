# Hyprland hyprlang rules (hyprland.conf, 0.53+ "match:" syntax) for Autodesk
# Inventor under Wine/XWayland. Hyprland with a Lua config: hyprland-inventor.lua
# (explanation of each rule there).
# Use with:  source = ~/inventor-on-linux/config/hyprland-inventor.conf

$inv = ^(inventor\.exe|adsklicensingagent\.exe|adskidentitymanager\.exe)$

# No Hyprland decoration / animation on Autodesk windows: avoids doubled grey
# outlines around WPF panels and the lagging coordinate input at the cursor.
windowrule = no_anim on, match:class $inv
windowrule = no_shadow on, match:class $inv
windowrule = no_blur on, match:class $inv
windowrule = no_dim on, match:class $inv
windowrule = border_size 0, match:class $inv
windowrule = rounding 0, match:class $inv
windowrule = no_follow_mouse on, match:class $inv
windowrule = decorate off, match:class $inv

# Wine asks for fullscreen on any caption-less window that covers the monitor.
# Inventor's right-click marking menu is such a transparent overlay; fullscreened,
# Hyprland stops drawing the windows under it - Inventor "disappears" and the
# menu floats over the wallpaper. Super+F still works (it is not an app request).
windowrule = suppress_event fullscreen maximize fullscreenoutput, match:class $inv

# Dialogs and panels float, the main window tiles.
windowrule = float on, match:class $inv
windowrule = tile on, match:class ^inventor\.exe$, match:title ^Autodesk Inventor.*
