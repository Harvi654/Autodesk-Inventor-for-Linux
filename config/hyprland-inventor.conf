# Hyprland 0.53/0.54 (hyprlang, hyprland.conf) rules for Autodesk Inventor under Wine/XWayland.
# Hyprland 0.55+ uses Lua: see hyprland-inventor.lua. Explanation in that file.
# Use with:  source = ~/inventor-on-linux/config/hyprland-inventor.conf

windowrule {
  name = inventor-plain
  match:class = ^(inventor\.exe|adsklicensingagent\.exe|adskidentitymanager\.exe)$
  decorate = off
  no_anim = on
  no_blur = on
  no_dim = on
  no_shadow = on
  border_size = 0
  rounding = 0
  no_follow_mouse = on
}

windowrule {
  name = inventor-float
  match:class = ^(inventor\.exe|adsklicensingagent\.exe|adskidentitymanager\.exe)$
  float = on
}

windowrule {
  name = inventor-main
  match:class = ^inventor\.exe$
  match:title = ^Autodesk Inventor.*
  tile = on
}
