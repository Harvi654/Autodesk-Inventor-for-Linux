# Builds this project's Wine (vanilla Wine + patches/) in public, so anyone can
# see what the downloadable Wine is made of. On main it publishes the result as
# a release "wine-<version>-<build>" (once per version/build, never "Latest").
name: Build Wine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/*.patch'
      - 'wine/version.env'
      - 'scripts/build-wine.sh'
      - '.github/workflows/build-wine.yml'

# Nothing by default; each job gets only what it needs (the build: read the
# repository; the release: write the release and its provenance attestation).
permissions: {}

concurrency:
  group: build-wine
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    permissions:
      contents: read
    timeout-minutes: 300
    outputs:
      name: ${{ steps.ver.outputs.name }}
    steps:
      - name: Build dependencies (official Arch repositories)
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git mingw-w64-gcc \
            alsa-lib libpulse gnutls krb5 dbus fontconfig freetype2 \
            libx11 libxext libxi libxrandr libxrender libxcursor libxcomposite libxinerama libxxf86vm libxkbcommon \
            wayland mesa libglvnd vulkan-icd-loader vulkan-headers \
            gst-plugins-base-libs sdl2 libcups libgphoto2 sane libpcap v4l-utils pcsclite unixodbc ocl-icd opencl-headers \
            giflib wine-mono wine-gecko

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version
        id: ver
        run: |
          . wine/version.env
          echo "name=wine-$WINE_VERSION-$WINE_BUILD" >> "$GITHUB_OUTPUT"
          echo "Wine $WINE_VERSION, build $WINE_BUILD"

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          JOBS=$(nproc) WORK=/tmp/work bash scripts/build-wine.sh dist

      - name: Logs on failure
        if: failure()
        run: tail -n 100 /tmp/work/*.log || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: dist/*
          retention-days: 30

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the release
      id-token: write       # sign the attestation (Sigstore)
      attestations: write   # store it
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist
      - name: Release already there?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists - not replacing it (raise WINE_BUILD in wine/version.env for a new one)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      # Signed build provenance for exactly the files that are published:
      # gh attestation verify FILE -R Harvi654/Autodesk-Inventor-for-Linux
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: steps.exists.outputs.skip != '1'
        with:
          subject-path: dist/*.tar.xz
      - name: Publish release (once per version/build)
        if: steps.exists.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.name }}
        run: |
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Wine for Inventor: $TAG" --latest=false \
            --notes "Vanilla Wine with this project's patches (patches/ at $GITHUB_SHA), built by the \"Build Wine\" workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID - the install scripts download it and check its SHA-256. You do not need to download it yourself. Wine is LGPL 2.1+; BUILDINFO inside lists the source and patches."
